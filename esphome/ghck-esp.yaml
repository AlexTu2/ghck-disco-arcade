# GHCK-ESP — Good Hood Community Kitchen disco arcade button
# Board: ESP32-P4 eval board, Ethernet (IP101). IR out GPIO20, LED GPIO21, button GPIO22.
# NOTE: a later message changed the button's cooldown condition to
#   'return !id(ir_active) && (millis() - id(last_press)) > 3000;'
# which also needs an `ir_active` bool global (not defined in this version).
# Hardware fix at the end of the chat: RC filter on GPIO22.

esphome:
  name: "esp32-p4-eth"
  friendly_name: GHCK-ESP
  min_version: 2025.11.0
  name_add_mac_suffix: false

esp32:
  board: esp32-p4-evboard
  flash_size: 16MB
  framework:
    type: esp-idf

logger:
  hardware_uart: UART0

api:
  encryption:
    key: !secret ghck_api_encryption_key

ota:
  platform: esphome

ethernet:
  type: IP101
  mdc_pin: GPIO31
  mdio_pin: GPIO52
  power_pin: GPIO51
  clk:
    mode: CLK_EXT_IN
    pin: GPIO50
  phy_addr: 1

remote_transmitter:
  pin:
    number: GPIO20
    inverted: true
  carrier_duty_percent: 33%
  non_blocking: true

