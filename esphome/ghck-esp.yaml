output:
  - platform: ledc
    pin: GPIO21
    id: arcade_led_output

light:
  - platform: monochromatic
    output: arcade_led_output
    id: arcade_led
    name: "Button Glow"

globals:
  - id: last_press
    type: unsigned long
    restore_value: no
    initial_value: '0'
  - id: press_count
    type: int
    restore_value: no
    initial_value: '0'

number:
  - platform: template
    name: "MPD Volume"
    id: mpd_volume
    icon: "mdi:volume-high"
    min_value: 0
    max_value: 100
    step: 5
    initial_value: 30
    optimistic: true
    set_action:
      - homeassistant.service:
          service: shell_command.set_mpd_volume
          data_template:
            volume: !lambda "return (int)x;"

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO22
      mode: INPUT_PULLUP
      inverted: true
    name: "Arcade Button"
    id: physical_button
    filters:
      - delayed_on: 50ms
    on_press:
      then:
        - lambda: |-
            id(press_count)++;
            ESP_LOGW("button", ">>> PRESS #%d  uptime=%ds", id(press_count), (int)(millis()/1000));
        - if:
            condition:
              lambda: 'return (millis() - id(last_press)) > 3000;'
            then:
              - lambda: 'id(last_press) = millis();'
              - switch.toggle: automation_switch
            else:
              - lambda: |-
                  ESP_LOGW("button", ">>> IGNORED (cooldown)  uptime=%ds", (int)(millis()/1000));
    on_release:
      then:
        - lambda: |-
            ESP_LOGW("button", ">>> RELEASE  uptime=%ds", (int)(millis()/1000));

  - platform: homeassistant
    entity_id: input_boolean.automation_active
    id: ha_automation_active
    internal: true
    on_state:
      then:
        - if:
            condition:
              binary_sensor.is_on: ha_automation_active
            then:
              - light.turn_on: arcade_led
              - switch.template.publish:
                  id: automation_switch
                  state: ON
            else:
              - light.turn_off: arcade_led
              - switch.template.publish:
                  id: automation_switch
                  state: OFF

switch:
  - platform: template
    name: "Automation State"
    id: automation_switch
    icon: "mdi:play-network"
    optimistic: true
    turn_on_action:
      - homeassistant.service:
          service: input_boolean.turn_on
          data:
            entity_id: input_boolean.automation_active
    turn_off_action:
      - homeassistant.service:
          service: input_boolean.turn_off
          data:
            entity_id: input_boolean.automation_active

sensor:
  - platform: template
    name: "Button Press Count"
    lambda: return id(press_count);
    update_interval: 30s
  - platform: uptime
    name: "Uptime"
    update_interval: 60s
